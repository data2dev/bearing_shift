[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bearingshift"
dynamic = ["version"]
description = "Label-free bearing fault detection from healthy commissioning data, evaluated on run-to-failure data."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "data2dev and BearingShift contributors" }]
keywords = ["bearing", "vibration", "anomaly detection", "predictive maintenance", "condition monitoring"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
data = ["bearing-datasets"]
experiments = ["bearing-datasets", "matplotlib>=3.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/data2dev/bearing_shift"
Roadmap = "https://github.com/data2dev/bearing_shift/blob/main/ROADMAP.md"

[tool.hatch.version]
path = "src/bearingshift/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "DISCLAIMER.md", "DATA_LICENSES.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/bearingshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.coverage.run]
source = ["bearingshift"]
